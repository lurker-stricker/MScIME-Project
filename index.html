<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>雾都夜话 · 全三章</title>
<style>
  :root{
    --bg:#0d0f12;
    --panel:#14171b;
    --panel2:#1a1e23;
    --line:#2a3038;
    --text:#c9c3b4;
    --text-dim:#8a857a;
    --red:#b3261e;
    --red-dim:#6d1c17;
    --gold:#c8a24a;
    --link:#6a9fb5;
    --blood:#8a1f1f;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;
    font-size:15px;
    line-height:1.75;
    overflow-x:hidden;
    background-image:
      radial-gradient(ellipse at 50% -20%, rgba(138,31,31,.12), transparent 55%),
      repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);

  }
  a{color:var(--link);text-decoration:none;cursor:pointer;}
  a:hover{text-decoration:underline;}

  #app{max-width:880px;margin:0 auto;padding:24px 18px 80px;position:relative;}

  /* ===== 开场层 ===== */
  #intro{
    position:fixed;inset:0;z-index:100;
    background:#050607;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;text-align:center;
  }
  #intro .box{max-width:560px;padding:40px;}
  #intro .title{font-size:30px;letter-spacing:.35em;color:#d8d2c0;font-weight:700;}
  #intro .sub{margin-top:18px;color:var(--text-dim);font-size:14px;letter-spacing:.15em;}
  #intro .hint{margin-top:42px;color:#4d4a44;font-size:13px;letter-spacing:.3em;}
  #intro.fade{opacity:0;transition:opacity 1.4s;pointer-events:none;}

  /* ===== 论坛头部 ===== */
  header{
    border-bottom:1px solid var(--line);
    padding:10px 4px 18px;margin-bottom:22px;
  }
  header .logo{font-size:26px;font-weight:700;letter-spacing:.3em;color:#ddd8c8;}
  header .logo .red{color:var(--red);}
  header .slogan{color:var(--text-dim);font-size:12px;letter-spacing:.2em;margin-top:6px;}
  header .meta{color:#5a564d;font-size:12px;margin-top:14px;display:flex;gap:18px;flex-wrap:wrap;}
  #metaNotice{color:var(--red);letter-spacing:.1em;}

  .sec-title{
    font-size:13px;color:var(--text-dim);letter-spacing:.25em;
    margin:26px 0 10px;padding-left:10px;border-left:3px solid var(--red);
  }

  /* ===== 帖子列表 ===== */
  .post-row{
    display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
    padding:13px 14px;border:1px solid var(--line);background:var(--panel);

  .post-row .t{color:var(--link);font-size:15px;}
  .post-row .tag{color:#5a564d;font-size:12px;white-space:nowrap;}
  .post-row .auth{color:var(--text-dim);font-size:12px;white-space:nowrap;}
  .post-row .mark{color:var(--red);font-size:11px;border:1px solid var(--red-dim);padding:0 5px;border-radius:2px;margin-left:auto;white-space:nowrap;}
  .post-row.new{border-color:var(--red-dim);}
  .post-row.active{border-color:var(--red);background:var(--panel2);}
  .post-row.active .t{color:var(--gold);}

  /* ===== 帖子详情 ===== */
  #postDetail{margin-top:10px;}
  .thread{
    border:1px solid var(--line);background:var(--panel);
    padding:22px 24px;margin-bottom:16px;
  }
  .thread h2{font-size:20px;color:#ded9c9;font-weight:700;line-height:1.5;margin-bottom:8px;}
  .thread .by{color:var(--text-dim);font-size:12px;margin-bottom:18px;border-bottom:1px dashed var(--line);padding-bottom:12px;}
  .thread .body p{margin-bottom:14px;text-align:justify;}
  .thread .body .hl{color:var(--gold);}

  .reply{
    border:1px solid var(--line);background:var(--panel);
    padding:16px 20px;margin-bottom:10px;
  }
  .reply .head{color:var(--text-dim);font-size:12px;margin-bottom:10px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;}

  .reply .head .floor{color:#5a564d;}
  .reply .body p{margin-bottom:10px;}
  .reply.sys{background:var(--red-dim);border-color:var(--blood);color:#b89a94;font-size:13px;}

  .ask-btn{
    margin-top:10px;display:inline-block;
    background:transparent;border:1px solid var(--red-dim);color:var(--red);
    padding:5px 14px;font-size:13px;cursor:pointer;letter-spacing:.1em;

  }

  .back-btn{
    background:transparent;border:1px solid var(--line);color:var(--text-dim);

  .back-btn:hover{color:var(--text);border-color:#3a434d;}

  #cluePanel .cp-empty{color:#5a564d;font-size:12px;}

  #dlg-options{margin-top:10px;}

  #dlgName{padding-right:34px;}
  #dlgX{
    position:absolute;top:10px;right:12px;

  #puzzleBar .u-sub{color:var(--text-dim);font-size:12px;margin-bottom:12px;}

    92%{opacity:1;}

    94%{opacity:1;}
    96%{opacity:.5;}

</style>
</head>

<script>
/* ============================================================
   打字机
   ============================================================ */
const TYPE_SPEED = 8; // 毫秒/字，越小越快

function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

const $ = s => document.querySelector(s);

function typeText(el, html, done){
  const div = document.createElement('div');
  div.className = 'say';
  el.appendChild(div);
  let idx = 0, skipped = false;
  function finish(){
    if(skipped) return;
    skipped = true;
    div.innerHTML = html;
    done && done();
  }
  function tick(){
    if(skipped) return;
    if(idx <= html.length){
      div.innerHTML = html.slice(0, idx) + '<span style="color:var(--red)">▌</span>';
      idx++;
      setTimeout(tick, TYPE_SPEED);
    } else {
      div.innerHTML = html;
      done && done();
    }
  }
  setTimeout(tick, TYPE_SPEED);
  div.addEventListener('click', finish);
}

/* ============================================================
   状态层
   ============================================================ */
const state = {
  clues:[],
  newClues:[],
  visited:{},       // 各 NPC 已看过的对话节点（再次进入时直接显示，不再打字机）
  chosenOpts:{},    // 已点过的选项（隐藏点过的那一条，另一条路保留）
  unlocked:{ p3:false, p5:false },
  stage:1,
  openPost:null,   // 当前展开的帖子 id，null 表示未展开
  typed:{},        // 已读过的帖子 id（再次展开时不再打字机）
  finalShown:false
};

function isVisible(p){
  if(p.gated) return !!state.unlocked[p.id];
  return state.stage >= (p.stage || 1);
}

/* ============================================================
   渲染：帖子列表
   ============================================================ */
function renderList(){
  const el = $('#postList');
  const visible = POSTS.filter(isVisible);
  el.innerHTML = visible.map(p => {
    const mark = p.mark ? `<span class="mark">${esc(p.mark)}</span>` : '';
    const active = state.openPost === p.id ? ' active' : '';
    return `<div class="post-row${active}" data-id="${p.id}">
      <span class="t">${esc(p.title)}</span>
      <span class="auth">${esc(p.author)}</span>
      <span class="tag">${esc(p.time)}</span>
      ${mark}
    </div>`;
  }).join('');
  el.querySelectorAll('.post-row').forEach(row => {
    row.addEventListener('click', () => togglePost(row.dataset.id));
  });
}

/* 点一下展开、再点一下收起 */
function togglePost(id){
  if(state.openPost === id){
    state.openPost = null;
    $('#postDetail').innerHTML = '';
  } else {
    state.openPost = id;
    openPost(id);
  }
  renderList();
}

/* ============================================================
   渲染：帖子详情
   ============================================================ */
function openPost(id){
  const p = POSTS.find(x => x.id === id);
  if(!p) return;

  if(p.grantClue && !state.clues.includes(p.grantClue)){
    state.clues.push(p.grantClue);
    state.newClues.push(p.grantClue);
  }
  renderClues();

  const detail = $('#postDetail');
  const repliesHtml = (p.replies || []).map(r => {
    if(r.sys){
      return `<div class="reply sys"><div class="head">${esc(r.author)} · ${esc(r.time)}</div>
        <div class="body"><p>${r.text}</p></div></div>`;
    }
    const askBtn = r.npc ? `<button class="ask-btn" data-npc="${r.npc}" data-node="${r.npcNode || ''}">私信追问：${esc(r.author)}</button>` : '';
    return `<div class="reply">
      <div class="head"><span class="name">${esc(r.author)}</span><span class="floor">${esc(r.floor)}</span><span>${esc(r.time)}</span></div>
      <div class="body"><p>${r.text}</p></div>
      ${askBtn}
    </div>`;
  }).join('');

  const puzzleHtml = renderPuzzle(p);

  detail.innerHTML = `
    <div class="thread">
      <h2>${esc(p.title)}</h2>
      <div class="by">作者：${esc(p.author)} · ${esc(p.time)}</div>
      <div class="body" id="threadBody"></div>
      ${puzzleHtml}
    </div>
    <div class="reply-list">${repliesHtml}</div>
    <button class="back-btn" onclick="togglePost('${p.id}')">收起 ∧</button>
  `;

  // 正文：首次阅读用打字机，再次展开直接显示
  const tb = $('#threadBody');
  if(state.typed[p.id]){
    p.body.forEach(html => {
      const div = document.createElement('div');
      div.className = 'say';
      div.innerHTML = html;
      tb.appendChild(div);
    });
    onBodyDone(p);
  } else {
    state.typed[p.id] = true;
    let i = 0;
    function nextPara(){
      if(i < p.body.length){
        typeText(tb, p.body[i], nextPara);
        i++;
      } else {
        onBodyDone(p);
      }
    }
    nextPara();
  }

  // 绑定追问按钮
  detail.querySelectorAll('.ask-btn').forEach(b => {
    b.addEventListener('click', () => openDialogue(b.dataset.npc, b.dataset.node || null));
  });

  // 绑定谜题输入
  const bar = detail.querySelector('#puzzleBar');
  if(bar){
    const input = bar.querySelector('input');
    input.addEventListener('keydown', e => { if(e.key === 'Enter') submitPuzzle(p.id); });
  }
}

/* 正文读完后的收尾（触发结局） */
function onBodyDone(p){
  if(p.id === 'p3' && state.stage < 2){ showEnding(1); }
  else if(p.id === 'p5' && state.stage < 3){ showEnding(2); }
  else if(p.id === 'p6' && !state.finalShown){ state.finalShown = true; showEnding(3); }
}

/* 关键词谜题：若该帖有谜题、且所需线索已集齐、且目标尚未解锁，则显示输入框 */
function renderPuzzle(p){
  if(!p.puzzle) return '';
  const pz = p.puzzle;
  const ready = state.clues.includes(pz.requires);
  const done = !!state.unlocked[pz.unlock];
  if(!ready || done) return '';
  return `<div id="puzzleBar">
    <div class="u-title">▍ ${pz.title}</div>
    <div class="u-sub">${pz.sub}</div>
    <input placeholder="____" maxlength="10">
    <div class="u-msg"></div>
  </div>`;
}

function submitPuzzle(postId){
  const p = POSTS.find(x => x.id === postId);
  const pz = p.puzzle;
  const bar = document.querySelector('#puzzleBar');
  const input = bar.querySelector('input');
  const msg = bar.querySelector('.u-msg');
  const val = (input.value || '').replace(/\s+/g, '');
  if(!val) return;
  if(pz.answers.includes(val)){
    state.unlocked[pz.unlock] = true;
    msg.className = 'u-msg';
    msg.textContent = pz.success;
    const sysReply = document.createElement('div');
    sysReply.className = 'reply sys';
    sysReply.innerHTML = `<div class="head">系统</div><div class="body"><p>${pz.sysReply}</p></div>`;
    const list = document.querySelector('#postDetail .reply-list');
    list.insertBefore(sysReply, list.firstChild);
    setTimeout(renderList, 1200);
  } else {
    msg.className = 'u-msg err';
    msg.textContent = pz.fail;
  }
}

/* ============================================================
   对话弹窗
   ============================================================ */
function openDialogue(npcId, nodeOverride){
  const npc = NPCS[npcId];
  if(!npc) return;
  $('#dialogue').classList.add('show');
  $('#dlgName').textContent = '私信 · ' + npc.name;
  renderDialogue(npcId, nodeOverride || 'start');
}

function renderDialogue(npcId, nodeId){
  const npc = NPCS[npcId];
  const node = npc.nodes[nodeId];
  if(!node) return;
  const body = $('#dlg-body');
  body.innerHTML = '';

  // 记录已看过的节点；重复进入时直接显示、不再打字机
  if(!state.visited[npcId]) state.visited[npcId] = {};
  const already = !!state.visited[npcId][nodeId];
  state.visited[npcId][nodeId] = true;

  if(node.addClue && !state.clues.includes(node.addClue)){
    state.clues.push(node.addClue);
    state.newClues.push(node.addClue);
  }
  renderClues();

  if(already){
    node.say.forEach(html => {
      const div = document.createElement('div');
      div.className = 'say';
      div.innerHTML = html;
      body.appendChild(div);
    });
    renderOptions(npcId, nodeId, node);
    return;
  }

  let i = 0;
  function nextSay(){
    if(i < node.say.length){
      typeText(body, node.say[i], nextSay);
      i++;
    } else {
      renderOptions(npcId, nodeId, node);
    }
  }
  nextSay();
}

function renderOptions(npcId, nodeId, node){
  const body = $('#dlg-body');
  const opts = node.opts || [];
  if(opts.length === 0){
    body.innerHTML += `<button class="dlg-close" onclick="closeDialogue()">（ 结 束 对 话 ）</button>`;
    return;
  }
  const optsBox = document.createElement('div');
  optsBox.id = 'dlg-options';
  optsBox.innerHTML = opts.map((o, i) => {
    const key = npcId + '::' + nodeId + '::' + i;
    const chosen = !!state.chosenOpts[key];
    return `<button class="opt-btn${chosen ? ' chosen' : ''}" data-idx="${i}" data-next="${o.next || ''}">${esc(o.t)}</button>`;
  }).join('');
  body.appendChild(optsBox);

  optsBox.querySelectorAll('.opt-btn').forEach(b => {
    b.addEventListener('click', () => {
      // 标记该选项已选择过（仅灰化表示，不隐藏）
      state.chosenOpts[npcId + '::' + nodeId + '::' + b.dataset.idx] = true;
      const next = b.dataset.next;
      if(next){
        renderDialogue(npcId, next);
      } else {
        // 叶子选项：选完回到最初的选择项
        renderDialogue(npcId, 'start');
      }
    });
  });
}

function closeDialogue(){
  $('#dialogue').classList.remove('show');
  $('#dlg-body').innerHTML = '';
}

/* ============================================================
   线索库
   ============================================================ */
function renderClues(){
  const el = $('#clueList');
  if(state.clues.length === 0){
    el.className = 'cp-empty';
    el.textContent = '你还没有收集到任何线索。';
    return;
  }
  el.className = '';
  el.innerHTML = state.clues.map(id => {
    const isNew = state.newClues.includes(id);
    return `<div class="clue ${isNew?'new':''}">▸ ${CLUES[id]}</div>`;
  }).join('');
  if(state.newClues.length){
    setTimeout(()=>{ state.newClues = []; renderClues(); }, 3000);
  }
}

/* ============================================================
   结局屏
   ============================================================ */
function showEnding(stage){
  const e = ENDINGS[stage];
  $('#endingTitle').textContent = e.title;
  $('#endingTitle').classList.toggle('flicker', stage === 3);
  $('#endingBody').innerHTML = e.body.join('');
  const btns = $('#endingBtns');
  if(stage < 3){
    btns.innerHTML = `
      <button class="e-btn" id="btnContinue">继续追查 →</button>
      <button class="e-btn" onclick="location.reload()">重新开始</button>`;
    $('#btnContinue').addEventListener('click', () => continueStage(stage));
  } else {
    btns.innerHTML = `<button class="e-btn" onclick="location.reload()">重 新 开 始</button>`;
  }
  $('#ending').classList.add('show');
}

function continueStage(stage){
  $('#ending').classList.remove('show');
  state.stage = Math.max(state.stage, stage + 1);
  renderForum();
  $('#metaNotice').textContent = state.stage === 2 ? '▍ 检测到新帖子' : '▍ 论坛里，多了一条空号发来的消息';
}

/* ============================================================
   主流程
   ============================================================ */
function renderForum(){
  state.openPost = null;
  $('#postDetail').innerHTML = '';
  renderList();
}

$('#intro').addEventListener('click', function(){
  if(state.started) return;
  state.started = true;
  this.classList.add('fade');
  setTimeout(()=> this.remove(), 1400);
  renderList();
});

// 对话弹窗：点击背景空白处，或按 ESC，可中途退出
$('#dialogue').addEventListener('click', function(e){
  if(e.target === this) closeDialogue();
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') closeDialogue();
});

renderList();
</script>
</body>
